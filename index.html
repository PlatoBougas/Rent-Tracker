<style>
  :root {

    --google-purple-container: #f3e8fd;
    
    --google-green: #188038;
    --google-green-container: #e6f4ea;

  .mono {

  button, input, select, textarea {
    font-family: inherit;

  }

  .container {
    max-width: 1060px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Minimal Clean Header */

  .brand-logo {

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ==========================================================================
   CONSTANTS & SPLITS
   ========================================================================== */
const RENT_SPLIT_PLATO = 51.5; // Base Rent: 51.5% Plato, 48.5% Zong
const UTILITY_SPLIT_PLATO = 50.0;
const GARAGE_SPLIT_PLATO = 50.0;
const OTHER_SPLIT_PLATO = 50.0;

const STORAGE_KEY = "rowe-split-ledger-v7";
const PORTAL_URL = "https://rowepearvillage.securecafe.com/residentservices/rowe-at-pear-village/userlogin.aspx";

const CATEGORIES = {
  rent: { label: "Base Rent", defaultSplit: RENT_SPLIT_PLATO },
  utility: { label: "Utility", defaultSplit: UTILITY_SPLIT_PLATO },
  garage: { label: "Garage", defaultSplit: GARAGE_SPLIT_PLATO },
  other: { label: "Other", defaultSplit: OTHER_SPLIT_PLATO },
  plato_only: { label: "Plato 100%", defaultSplit: 100.0 },
  zong_only: { label: "Zong 100%", defaultSplit: 0.0 },
};

/* Format currency helper */
const fmt = (n) => {
  const v = Number(n) || 0;
  const sign = v < 0 ? "-" : "";
  return sign + "$" + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};

const fmtShort = (n) => {
  const v = Number(n) || 0;
  if (v === 0) return "—";
  const sign = v < 0 ? "-" : "";
  return sign + "$" + Math.round(Math.abs(v)).toLocaleString("en-US");
};

const uid = () => Math.random().toString(36).slice(2, 10);

/* Month labels */
const monthShort = (id) => {
  const [y, m] = id.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "short" });
};

const monthFull = (id) => {
  const [y, m] = id.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
};

          if (!m.notesPlato && m.notes) m.notesPlato = m.notes;
          if (m.notesPlato === undefined) m.notesPlato = "";
          if (m.notesZong === undefined) m.notesZong = "";
          if (m.lineItems) {
            m.lineItems.forEach((it) => {
              if (it.category === "other" && /garage/i.test(it.name)) {
                it.category = "garage";
              }
            });
          }
        });
        return parsed;
      }
    }
  } catch (e) {

  }
  return getInitialData();
}

/* ==========================================================================
   OCR PARSER HELPER
   ========================================================================== */
function parseStatementLines(text) {
  const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
  const moneyRe = /-?\$?\s?-?[\d,]+\.\d{2}/g;
  const parsed = [];

  lines.forEach((line) => {
    const match = line.match(moneyRe);
    if (!match) return;
    const amtStr = match[match.length - 1].replace(/[\s$]/g, "");
    const amount = parseFloat(amtStr.replace(/,/g, ""));
    if (Number.isNaN(amount)) return;

    let label = line.replace(match[match.length - 1], "").trim().replace(/[-–—]\s*$/, "").trim();
    if (!label || /total|balance|due|subtotal|pay now/i.test(label)) return;

    const lower = label.toLowerCase();
    let cat = "other";
    if (lower.includes("rent") || lower.includes("concession")) cat = "rent";
    else if (lower.includes("garage") || lower.includes("parking")) cat = "garage";
    else if (/(trash|internet|water|electric|sewer|gas|pest)/.test(lower)) cat = "utility";

    parsed.push({
      id: uid(),
      name: label,
      amount,
      category: cat,
      splitPlato: CATEGORIES[cat].defaultSplit,
    });
  });
  return parsed;
}

/* Default Google Apps Script code to paste into Google Sheet */
const GOOGLE_APPS_SCRIPT_CODE = `function doGet(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName("LedgerData") || ss.getSheets()[0];
  var val = sheet.getRange("A1").getValue();
  return ContentService.createTextOutput(val || "{}").setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  try {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var dataSheet = ss.getSheetByName("LedgerData");
    if (!dataSheet) dataSheet = ss.insertSheet("LedgerData");
    var payload = e.postData.contents;
    dataSheet.getRange("A1").setValue(payload);
    updateSummarySheet(ss, JSON.parse(payload));
    return ContentService.createTextOutput(JSON.stringify({ status: "success" })).setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({ error: err.toString() })).setMimeType(ContentService.MimeType.JSON);
  }
}

function updateSummarySheet(ss, state) {
  var sheet = ss.getSheetByName("Summary");
  if (!sheet) sheet = ss.insertSheet("Summary", 0);
  sheet.clear();
  sheet.appendRow(["Month", "Description", "Category", "Amount", "Plato Share ($)", "Zong Share ($)", "Plato Paid", "Zong Paid", "Plato Comments", "Zong Comments"]);
  sheet.getRange(1, 1, 1, 10).setFontWeight("bold").setBackground("#e8f0fe");
  var months = state.months || {};
  for (var id in months) {
    var m = months[id];
    var items = m.lineItems || [];
    if (items.length === 0) {
      sheet.appendRow([id, "(Blank)", "-", 0, 0, 0, m.paid && m.paid.plato ? "Yes" : "No", m.paid && m.paid.zong ? "Yes" : "No", m.notesPlato || "", m.notesZong || ""]);
    } else {
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var p = (it.amount * it.splitPlato) / 100;
        sheet.appendRow([id, it.name, it.category, it.amount, p, it.amount - p, m.paid && m.paid.plato ? "Yes" : "No", m.paid && m.paid.zong ? "Yes" : "No", i === 0 ? (m.notesPlato || "") : "", i === 0 ? (m.notesZong || "") : ""]);
      }
    }
  }
}`;

  });

  }, [sheetSyncUrl]);

  /* Fetch live state from Google Sheet on mount if configured */

      return { total: 0, plato: 0, zong: 0, isBlank: true, isPaid: false };
    }
    let total = 0, plato = 0, zong = 0;

      total += it.amount;
      plato += p;

              <div className="drop-zone-left">
                <div className="drop-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                  </svg>
                </div>
                <div>
                  <div className="drop-text-main">
                    Drag &amp; drop statement screenshot here, or press <strong>⌘V</strong> to paste from clipboard
                  </div>
                  <div className="drop-text-sub">
                    Automatically extracts charges and applies roommate splits
                  </div>
                </div>
              </div>
              <button className="btn btn-outline btn-sm" type="button">
                Upload Image
              </button>
            </div>
          )}

          {/* Statement Charges Table Card */}
          <div className="card">
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
              <div>
                <span style={{ fontSize: 14.5, fontWeight: 600 }}>Statement Line Items</span>
                <span className="mono" style={{ fontSize: 13, color: "var(--text-secondary)", marginLeft: 10 }}>
                  Total: {fmt(activeTotals.total)}
                </span>
              </div>

              {!isReadOnly && (
                <div style={{ display: "flex", gap: 8 }}>
                  {activeMonth.lineItems.length === 0 && (
                    <button className="btn btn-tonal btn-sm" onClick={populateStandard}>
                      ⚡ Load Standard Rent ($5,801)
                    </button>
                  )}
                  <button className="btn btn-primary btn-sm" onClick={addLine}>
                    + Add Line Item
                  </button>
                </div>
              )}
            </div>

            {/* Content / Table */}
            {activeMonth.lineItems.length === 0 ? (
              <div style={{ textAlign: "center", padding: "36px 16px", color: "var(--text-secondary)" }}>
                <div style={{ fontSize: 14, fontWeight: 500, color: "var(--text-primary)", marginBottom: 4 }}>
                  No charges entered for {monthShort(activeId)}
                </div>
                {!isReadOnly ? (
                  <>
                    <div style={{ fontSize: 12.5, marginBottom: 14 }}>
                      Drag &amp; drop a statement screenshot above, paste (⌘V), or load standard rent.
                    </div>
                    <button className="btn btn-tonal btn-sm" onClick={populateStandard}>
                      Fill Standard Charges ($5,801 + Utilities)
                    </button>
                  </>
                ) : (
                  <div style={{ fontSize: 12.5 }}>This statement is currently empty.</div>
                )}
              </div>
            ) : (
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th style={{ width: "36%" }}>Charge Description</th>
                      <th style={{ width: "20%" }}>Category</th>
                      <th style={{ width: "16%", textAlign: "right" }}>Amount</th>
                      <th style={{ width: "13%", textAlign: "right" }}>{state.roommates.plato} ($)</th>
                      <th style={{ width: "13%", textAlign: "right" }}>{state.roommates.zong} ($)</th>
                      {!isReadOnly && <th style={{ width: "2%" }}></th>}
                    </tr>
                  </thead>
                  <tbody>
                    {activeMonth.lineItems.map((item) => {
                      const platoAmt = (item.amount * item.splitPlato) / 100;
                      const zongAmt = item.amount - platoAmt;

                      return (
                        <tr key={item.id}>
                          <td>
                            {!isReadOnly ? (
                              <input
                                className="cell-input"
                                value={item.name}
                                onChange={(e) => updateLine(item.id, { name: e.target.value })}
                              />
                            ) : (
                              <span style={{ fontWeight: 500 }}>{item.name}</span>
                            )}
                          </td>
                          <td>
                            {!isReadOnly ? (
                              <select
                                className="cell-select"
                                value={item.category}
                                onChange={(e) => {
                                  const cat = e.target.value;
                                  updateLine(item.id, {
                                    category: cat,
                                    splitPlato: CATEGORIES[cat]?.defaultSplit ?? 50.0,
                                  });
                                }}
                              >
                                <option value="rent">Base Rent (51.5 / 48.5)</option>
                                <option value="utility">Utility (50 / 50)</option>
                                <option value="garage">Garage (50 / 50)</option>
                                <option value="other">Other (50 / 50)</option>
                                <option value="plato_only">{state.roommates.plato} 100% (100 / 0)</option>
                                <option value="zong_only">{state.roommates.zong} 100% (0 / 100)</option>
                              </select>
                            ) : (
                              <span className="cat-badge">
                                {item.category === "plato_only"
                                  ? `${state.roommates.plato} 100%`
                                  : item.category === "zong_only"
                                  ? `${state.roommates.zong} 100%`
                                  : (CATEGORIES[item.category]?.label || item.category)}
                              </span>
                            )}
                          </td>
                          <td style={{ textAlign: "right" }}>
                            {!isReadOnly ? (
                              <input
                                className="cell-input mono"
                                style={{ textAlign: "right" }}
                                type="number"
                                step="0.01"
                                value={item.amount}
                                onChange={(e) => updateLine(item.id, { amount: parseFloat(e.target.value) || 0 })}
                              />
                            ) : (
                              <span className="mono" style={{ fontWeight: 600 }}>{fmt(item.amount)}</span>
                            )}
                          </td>
                          <td style={{ textAlign: "right" }} className="mono">
                            <span style={{ color: "var(--google-blue)", fontWeight: 500 }}>{fmt(platoAmt)}</span>
                          </td>
                          <td style={{ textAlign: "right" }} className="mono">
                            <span style={{ color: "var(--google-purple)", fontWeight: 500 }}>{fmt(zongAmt)}</span>
                          </td>
                          {!isReadOnly && (
                            <td style={{ textAlign: "center" }}>
                              <button
                                className="icon-btn"
                                onClick={() => removeLine(item.id)}
                                title="Delete row"
                              >
                                ✕
                              </button>
                            </td>
                          )}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>

          {/* Separate Notes & Comments Section for Plato and Zong */}
          <div className="comments-section">
            <div className="comments-grid">
              {/* Plato's Comments */}
              <div className="comment-card">
                <div className="comment-header">
                  <div className="comment-author">
                    <span className="author-dot" style={{ background: "var(--google-blue)" }}></span>
                    <span>{state.roommates.plato}'s Notes</span>
                  </div>
                  <span style={{ fontSize: 11.5, color: "var(--text-tertiary)" }}>{monthShort(activeId)}</span>
                </div>
                {!isReadOnly ? (
                  <textarea
                    className="comment-textarea"
                    placeholder={`Add personal notes, payment confirmation, or receipt details for ${monthShort(activeId)}...`}
                    value={activeMonth.notesPlato || ""}
                    onChange={(e) => updateActive({ notesPlato: e.target.value })}
                  />
                ) : (
                  <div className="comment-readonly-display" style={{ fontStyle: activeMonth.notesPlato ? "normal" : "italic", color: activeMonth.notesPlato ? "inherit" : "var(--text-tertiary)" }}>
                    {activeMonth.notesPlato || "No comments entered for this month."}
                  </div>
                )}
              </div>

              {/* Zong's Comments */}
              <div className="comment-card">
                <div className="comment-header">
                  <div className="comment-author">
                    <span className="author-dot" style={{ background: "var(--google-purple)" }}></span>
                    <span>{state.roommates.zong}'s Notes</span>
                  </div>
                  <span style={{ fontSize: 11.5, color: "var(--text-tertiary)" }}>{monthShort(activeId)}</span>
                </div>
                {!isReadOnly ? (
                  <textarea
                    className="comment-textarea"
                    placeholder={`Add comments, payment confirmation, or notes for ${monthShort(activeId)}...`}
                    value={activeMonth.notesZong || ""}
                    onChange={(e) => updateActive({ notesZong: e.target.value })}
                  />
                ) : (
                  <div className="comment-readonly-display" style={{ fontStyle: activeMonth.notesZong ? "normal" : "italic", color: activeMonth.notesZong ? "inherit" : "var(--text-tertiary)" }}>
                    {activeMonth.notesZong || "No comments entered for this month."}
                  </div>
                )}
              </div>
            </div>
          </div>
        </section>
      </main>

      {/* Google Sheets Sync Setup Modal */}
      {showSyncModal && (
        <div className="modal-overlay" onClick={() => setShowSyncModal(false)}>
          <div className="modal-box" onClick={(e) => e.stopPropagation()}>
            <div className="modal-title">
              <span style={{ fontSize: 22 }}>📊</span>
              <span>Connect Google Sheets for Live 2-Way Sync</span>
            </div>

            <p style={{ fontSize: 13.5, color: "var(--text-secondary)" }}>
              Syncing to a Google Sheet allows you, Zong, and your family to always see the exact same live ledger numbers across all your devices, while keeping a formatted spreadsheet backup on your Google Drive.
            </p>

            <div style={{ fontSize: 13, display: "flex", flexDirection: "column", gap: 10 }}>
              <div>
                <strong>Step 1:</strong> Create a new blank Google Sheet at <a href="https://sheet.new" target="_blank" rel="noopener noreferrer" style={{ color: "var(--google-blue)" }}>sheet.new ↗</a>
              </div>

              <div>
                <strong>Step 2:</strong> In your Google Sheet, click <em>Extensions &gt; Apps Script</em>, delete all existing text, and paste this script:
                <div style={{ marginTop: 6, position: "relative" }}>
                  <div className="code-block">{GOOGLE_APPS_SCRIPT_CODE}</div>
                  <button
                    className="btn btn-sm btn-tonal"
                    style={{ position: "absolute", top: 8, right: 8 }}
                    onClick={() => {
                      navigator.clipboard.writeText(GOOGLE_APPS_SCRIPT_CODE);
                      showToast("Google Apps Script code copied to clipboard!");
                    }}
                  >
                    Copy Code
                  </button>
                </div>
              </div>

              <div>
                <strong>Step 3:</strong> Click <strong>Deploy &gt; New deployment</strong>, select <strong>Web app</strong> (click the gear icon next to 'Select type'), set <em>Who has access</em> to <strong>Anyone</strong>, click <strong>Deploy</strong>, and copy the Web App URL.
              </div>

              <div style={{ marginTop: 8 }}>
                <label style={{ display: "block", fontWeight: 600, marginBottom: 4 }}>Paste Web App URL here:</label>
                <input
                  type="url"
                  placeholder="https://script.google.com/macros/s/.../exec"
                  value={tempSheetUrl}
                  onChange={(e) => setTempSheetUrl(e.target.value.trim())}
                  style={{ width: "100%", padding: "10px 12px", border: "1px solid var(--border)", borderRadius: "8px", fontSize: "13px" }}
                />
              </div>
            </div>

            <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 10 }}>
              {sheetSyncUrl && (
                <button
                  className="btn btn-outline btn-sm"
                  style={{ color: "#d93025" }}
                  onClick={() => {
                    setSheetSyncUrl("");
                    setTempSheetUrl("");
                    localStorage.removeItem("rowe_sheet_sync_url");
                    setShowSyncModal(false);
                    showToast("Google Sheet disconnected.");
                  }}
                >
                  Disconnect
                </button>
              )}
              <button className="btn btn-outline btn-sm" onClick={() => setShowSyncModal(false)}>
                Cancel
              </button>
              <button
                className="btn btn-primary btn-sm"
                onClick={() => {
                  setSheetSyncUrl(tempSheetUrl);
                  setShowSyncModal(false);
                  if (tempSheetUrl) {
                    showToast("Connecting and syncing with Google Sheets...");
                  }
                }}
              >
                Save &amp; Sync Now
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Toast */}
      {toast && (
        <div className="toast">
          <span>{toast}</span>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
